name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      # oref0 0.7.1 from the committed lockfile, without install scripts (SIMULATION.md).
      - name: Install oref0
        working-directory: node
        run: |
          node --version
          npm ci --ignore-scripts
      # The bridge tests skip when node or oref0 is missing; here they must run.
      - run: uv run python -c "from ghostlows_aid.oref import node_available; assert node_available()"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: oref0's own test suite
        working-directory: node
        run: |
          t=node_modules/oref0/tests
          npx --no-install mocha $t/determine-basal.test.js $t/iob.test.js $t/get-last-glucose.test.js $t/basal.test.js
